# Hand-written rule configuration. Every number here is law; engine.py contains no rates or limits.
fy = "2025-26"

[hra]
clause = "S10-13A"
rent_excess_over_salary_pct = 10
metro_pct = 50
non_metro_pct = 40

[home_loan]
clause = "S24-b"
setoff_clause = "S71-3A"
cap = 200000

[cess]
clause = "CESS"
pct = 4

[[deductions]]
field = "sec_80c"
clause = "S80C"
cap = 150000

[[deductions]]
field = "sec_80ccd1b"
clause = "S80CCD-1B"
cap = 50000

[[deductions]]
field = "sec_80d_self"
clause = "S80D-SELF"
cap = 25000
senior_cap = 50000
senior_when = "self_age"
senior_age = 60

[[deductions]]
field = "sec_80d_parents"
clause = "S80D-PARENTS"
cap = 25000
senior_cap = 50000
senior_when = "parents_senior"

[old]
